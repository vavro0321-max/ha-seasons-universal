# HA Seasons AI V1.0 – jedna centrálna automatizácia snehu.
# Uložte ako /config/packages/ha_seasons_v1.yaml po zapnutí packages.
# NEPOUŽÍVAJTE súčasne so staršími balíkmi/automatizáciami V0.4–V0.6.
input_number:
  ha_seasons_snow_cover:
    name: HA Seasons – vizuálne zasneženie
    min: 0
    max: 100
    step: 0.1
    mode: box
    icon: mdi:weather-snowy

automation:
  - id: ha_seasons_dynamic_snow_v1
    alias: HA Seasons V1.0 – dynamický sneh
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: '/30'
    conditions:
      - condition: template
        value_template: >-
          {{ is_number(states('sensor.ws2900_v2_02_01_outdoor_temperature'))
             and (states('weather.home') not in ['unknown','unavailable','none','']
                  or states('weather.forecast_cierne_11') not in ['unknown','unavailable','none',''])
             and is_number(states('input_number.ha_seasons_snow_cover')) }}
    actions:
      - variables:
          t: "{{ states('sensor.ws2900_v2_02_01_outdoor_temperature') | float }}"
          condition_now: >-
            {{ states('weather.home') if states('weather.home') not in ['unknown','unavailable','none','']
               else states('weather.forecast_cierne_11') }}
          prior: "{{ states('input_number.ha_seasons_snow_cover') | float }}"
      - variables:
          snowing: "{{ condition_now in ['snowy','snowy-rainy'] and (t | float) <= 1 }}"
          raining: "{{ condition_now in ['rainy','pouring'] }}"
      - variables:
          rate: >-
            {% set temp = t | float %}
            {% if snowing %}{{ 20 if temp <= -3 else 16 if temp <= -1 else 12 if temp <= 0 else 6 }}
            {% elif temp <= 0 %}0
            {% elif temp <= 2 %}-4
            {% elif temp <= 5 %}-10
            {% elif temp <= 8 %}-16
            {% else %}-24{% endif %}
      - variables:
          updated: >-
            {% set bonus = 10 if raining and not snowing and (t | float) > 0 else 0 %}
            {% set val = (prior | float) + ((rate | float) - bonus) * 0.5 %}
            {{ [[val, 0] | max, 100] | min | round(1) }}
      - action: input_number.set_value
        target:
          entity_id: input_number.ha_seasons_snow_cover
        data:
          value: "{{ updated | float }}"
