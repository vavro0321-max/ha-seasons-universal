name: Validate HA Seasons Universal

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    name: HACS Marketplace plugin validation
    runs-on: ubuntu-latest
    steps:
      - name: Validate repository for Dashboard/Plugin category
        uses: hacs/action@main
        with:
          category: plugin

  validate-image-assets:
    name: Required V1.6 seasonal photos present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate both shared landscape WebP images
        run: node test-required-images.cjs

  test-javascript:
    name: JavaScript syntax and logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check JavaScript syntax
        run: node --check dist/ha-seasons-universal.js
      - name: Test weather and seasonal logic
        run: node test-logic.cjs
      - name: Test WS2900 and online weather reconciliation
        run: node test-weather-sources.cjs
      - name: Test seasonal winter photo versus actual live snowfall
        run: node test-winter-scene-vs-snowfall.cjs
      - name: Test Advent wreath, Sunday candles and Christmas tree
        run: node test-advent.cjs
      - name: Test realistic holiday placement on the ground
        run: node test-holiday-placement.cjs
      - name: Test natural ground shading and Advent lighting
        run: node test-natural-holiday-compositing.cjs
      - name: Test embedded photographic Advent scene and lighting schedule
        run: node test-photographic-advent.cjs
      - name: Test final snow panorama with four candles and winter fallback
        run: node test-snow-landscape.cjs
      - name: Test sunrise sunset and night transitions
        run: node test-sun-cycle.cjs
      - name: Test moonlit night and ground frost
        run: node test-night-weather.cjs
      - name: Test brighter night and editable exposure
        run: node test-night-brightness.cjs
      - name: Test optional waste collection and night visibility
        run: node test-waste-display.cjs
      - name: Test personal backgrounds and all four seasons
        run: node test-custom-backgrounds.cjs
      - name: Test clear scenery without artificial haze
        run: node test-clear-scenery.cjs
      - name: Test Kamery tab pause and return
        run: node test-camera-tab.cjs
      - name: Test realistic seasonal colors and November autumn
        run: node test-seasonal-colors.cjs
      - name: Test unified landscape fog and leafless trees
        run: node test-unified-landscape.cjs
      - name: Test missing photo fallback does not break dashboard
        run: node test-image-fallback.cjs
